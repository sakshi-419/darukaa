version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: darukaa-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  postgres:
    image: postgres:15-alpine
    container_name: darukaa-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=darukaa_earth
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: darukaa-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=mock
      - VECTOR_DB_TYPE=qdrant
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/darukaa_earth
    depends_on:
      - qdrant
      - postgres

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: darukaa-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api
    depends_on:
      - backend

volumes:
  qdrant_data:
  postgres_data:
